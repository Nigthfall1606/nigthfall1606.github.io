<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle del Curso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root {
            --color-purple: #6c63ff;
            --color-blue: #0066cc;
            --color-green: #34d399;
            --color-cyan: #00d4ff;
        }
        
        body {
            background: linear-gradient(135deg, #2d1b69 0%, #0f2d6b 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            padding: 20px 0;
        }
        
        .detalle-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 700px;
            margin: 40px auto;
            overflow: hidden;
        }
        
        .curso-header {
            background: linear-gradient(135deg, #6c63ff 0%, #00d4ff 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .curso-header h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .curso-chip-header {
            display: inline-block;
            background: rgba(255, 255, 255, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .curso-precio-header {
            font-size: 24px;
            font-weight: bold;
            margin-top: 15px;
        }
        
        .detalle-content {
            padding: 40px 30px;
        }
        
        .seccion-info {
            margin-bottom: 30px;
        }
        
        .seccion-titulo {
            font-size: 18px;
            font-weight: bold;
            color: #2d1b69;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .info-item {
            text-align: center;
        }
        
        .info-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        
        .info-valor {
            font-size: 18px;
            font-weight: bold;
            color: #2d1b69;
        }
        
        .descripcion {
            line-height: 1.6;
            color: #555;
            text-align: justify;
        }
        
        .punto-item {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            color: #555;
        }
        
        .punto-item i {
            color: #34d399;
            flex-shrink: 0;
            margin-top: 2px;
        }
        
        .requisitos {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #34d399;
        }
        
        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            color: #6c63ff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        
        .back-button:hover {
            color: #00d4ff;
        }
    </style>
</head>
<body>
    <div class="detalle-container">
        <div class="curso-header">
            <div class="curso-chip-header" id="chipCategoria"></div>
            <h1 id="cursoTitulo">Cargando...</h1>
            <div class="curso-precio-header" id="cursoPrecio"></div>
        </div>
        
        <div class="detalle-content">
            <div class="seccion-info">
                <div class="seccion-titulo">📊 Información General</div>
                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">Duración</div>
                        <div class="info-valor" id="duracion">--</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Nivel</div>
                        <div class="info-valor" id="nivel">--</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Estado</div>
                        <div class="info-valor" id="estado">--</div>
                    </div>
                </div>
            </div>
            
            <div class="seccion-info">
                <div class="seccion-titulo">📝 Descripción</div>
                <p class="descripcion" id="descripcion">Cargando descripción...</p>
            </div>
            
            <div class="seccion-info">
                <div class="seccion-titulo">🎯 ¿Qué aprenderás?</div>
                <div id="aprenderás"></div>
            </div>
            
            <div class="seccion-info requisitos">
                <div class="seccion-titulo" style="border-bottom: none; color: #2d1b69;">📋 Requisitos</div>
                <div id="requisitos"></div>
            </div>
        </div>
    </div>

    <script>
        // Información de los cursos
        const cursos = {
            'introduccion-ia-docentes': {
                titulo: 'Introducción a la IA para docentes',
                categoria: 'Fundamentos',
                precio: 'Gratuito',
                duracion: '24 hrs',
                nivel: 'Básico',
                estado: 'Disponible',
                descripcion: 'Este curso proporciona a los docentes una introducción completa a los principios fundamentales de la Inteligencia Artificial y cómo integrarla de forma práctica y ética en el aula. Aprenderás desde conceptos básicos hasta aplicaciones prácticas para mejorar la enseñanza.',
                aprende: [
                    'Conceptos fundamentales de la IA y machine learning',
                    'Herramientas de IA útiles para docentes',
                    'Integración ética de la IA en el aula',
                    'Casos de éxito en educación',
                    'Mejores prácticas y seguridad'
                ],
                requisitos: [
                    'No requiere conocimientos previos de programación',
                    'Acceso a una computadora e internet',
                    'Motivación por aprender nuevas tecnologías'
                ]
            },
            'machine-learning-ciencias': {
                titulo: 'Machine Learning en ciencias',
                categoria: 'Investigación',
                precio: '$1500',
                duracion: '48 hrs',
                nivel: 'Intermedio',
                estado: 'Próximamente',
                descripcion: 'Aprende a utilizar modelos predictivos y análisis de datos para tus proyectos de investigación académica y científica. Este curso te enseñará técnicas avanzadas de machine learning aplicadas a contextos reales.',
                aprende: [
                    'Fundamentos de machine learning y estadística',
                    'Preparación y análisis de datos científicos',
                    'Modelos predictivos y de clasificación',
                    'Validación y evaluación de modelos',
                    'Herramientas como Python, Scikit-learn y Pandas'
                ],
                requisitos: [
                    'Conocimientos básicos de Python o programación',
                    'Nociones de estadística',
                    'Experiencia previa con análisis de datos'
                ]
            },
            'procesamiento-lenguaje-natural': {
                titulo: 'Procesamiento de lenguaje natural',
                categoria: 'Avanzado',
                precio: '$2000',
                duracion: '60 hrs',
                nivel: 'Avanzado',
                estado: 'En desarrollo',
                descripcion: 'Domina las técnicas de Procesamiento de Lenguaje Natural (NLP) para análisis de textos académicos, revisión de literatura y generación de contenido. Una especialización avanzada para investigadores y académicos.',
                aprende: [
                    'Fundamentos del procesamiento de lenguaje natural',
                    'Análisis de sentimientos y extracción de información',
                    'Modelos de lenguaje y transformers',
                    'Aplicaciones en revisión de literatura académica',
                    'Generación automática de resúmenes y contenido'
                ],
                requisitos: [
                    'Experiencia sólida en Python',
                    'Conocimientos de machine learning',
                    'Familiaridad con librerías como NLTK, spaCy o Hugging Face'
                ]
            },
            'etica-ia-educacion': {
                titulo: 'Ética e IA responsable en educación',
                categoria: 'Ética IA',
                precio: 'Gratuito',
                duracion: '18 hrs',
                nivel: 'Todos',
                estado: 'Disponible',
                descripcion: 'Explora las implicaciones éticas del uso de la Inteligencia Artificial en contextos educativos. Aprenderás sobre sesgo algorítmico, regulación y cómo implementar IA de manera responsable.',
                aprende: [
                    'Marco ético para la IA en educación',
                    'Detección y mitigación de sesgos algorítmicos',
                    'Privacidad y protección de datos en sistemas de IA',
                    'Regulación y normativas (GDPR, etc.)',
                    'Desarrollo responsable de tecnología educativa'
                ],
                requisitos: [
                    'No requiere conocimientos técnicos previos',
                    'Interés en temas éticos y sociales',
                    'Participación activa en discusiones'
                ]
            }
        };

        // Obtener parámetro de URL
        const urlParams = new URLSearchParams(window.location.search);
        const cursoId = urlParams.get('id');
        const curso = cursos[cursoId];

        if (!curso) {
            document.body.innerHTML = '<div class="detalle-container" style="text-align: center; padding: 40px;"><h2>Curso no encontrado</h2></div>';
        } else {
            // Llenar datos del curso
            document.getElementById('chipCategoria').textContent = curso.categoria;
            document.getElementById('cursoTitulo').textContent = curso.titulo;
            document.getElementById('cursoPrecio').textContent = curso.precio;
            document.getElementById('duracion').textContent = curso.duracion;
            document.getElementById('nivel').textContent = curso.nivel;
            document.getElementById('estado').textContent = curso.estado;
            document.getElementById('descripcion').textContent = curso.descripcion;

            // Llenar "¿Qué aprenderás?"
            const aprenderasDiv = document.getElementById('aprenderás');
            curso.aprende.forEach(item => {
                aprenderasDiv.innerHTML += `
                    <div class="punto-item">
                        <i class="bi bi-check-circle-fill"></i>
                        <span>${item}</span>
                    </div>
                `;
            });

            // Llenar requisitos
            const requisitosDiv = document.getElementById('requisitos');
            curso.requisitos.forEach(item => {
                requisitosDiv.innerHTML += `
                    <div class="punto-item">
                        <i class="bi bi-info-circle-fill"></i>
                        <span>${item}</span>
                    </div>
                `;
            });

// No hay botón de inscripción en la vista de detalles
        }
    </script>
</body>
</html>
